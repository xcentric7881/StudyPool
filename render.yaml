databases:
  - name: studypool-prototype-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: studypool-prototype
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studypool-prototype-db
          property: connectionString
      - key: STUDYPOOL_DB_SCHEMA
        value: studypool
      - key: APP_TIMEZONE
        value: Europe/London
      - key: PROTOTYPE_MODE
        value: "true"
      - key: NODE_ENV
        value: production
