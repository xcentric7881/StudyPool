services:
  - type: web
    name: studypool-prototype
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run prototype:seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:./studypool.db
      - key: APP_TIMEZONE
        value: Europe/London
      - key: PROTOTYPE_MODE
        value: "true"
      - key: NODE_ENV
        value: production
